[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-ai-app"
version = "0.1.0"
description = "Web-based chess application: FastAPI backend, Angular frontend, minimax AI agent (RL-ready)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "chess>=1.10",              # python-chess: authoritative rules/SAN/PGN
    "openai>=1.60",             # OpenAI-compatible client for the LLM agent
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*", "chess_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
